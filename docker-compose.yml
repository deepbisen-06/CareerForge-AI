services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: careerbridge-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://careerbridge:careerbridge_secure_pass@postgres:5432/careerbridge_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-careerbridge-ai-jwt-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerbridge-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerbridge-postgres
    restart: always
    environment:
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge_secure_pass
      POSTGRES_DB: careerbridge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careerbridge-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
